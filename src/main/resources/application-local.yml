spring:
  application:
    name: business-rules-engine
  cloud:
    aws:
      region:
        static: ${AWS_REGION:us-east-1}
      credentials:
        use-default-aws-credentials-chain: false

# Local SQS Configuration (LocalStack)
aws:
  region: ${AWS_REGION:us-east-1}
  sqs:
    endpoint: ${AWS_SQS_ENDPOINT:http://localhost:4566}
  access-key-id: ${AWS_ACCESS_KEY_ID:test}
  secret-access-key: ${AWS_SECRET_ACCESS_KEY:test}

# SQS Queue Configuration
# Use queue-name for queue name, or queue-url for full queue URL
sqs:
  queue-name: ${SQS_QUEUE_NAME:business-rules-queue}
  queue-url: ${SQS_QUEUE_URL:}
  # Batch processing configuration
  max-concurrent-messages: ${SQS_MAX_CONCURRENT_MESSAGES:10}
  max-messages-per-poll: ${SQS_MAX_MESSAGES_PER_POLL:10}
  poll-timeout-seconds: ${SQS_POLL_TIMEOUT_SECONDS:20}

logging:
  level:
    com.businessrules: DEBUG
    org.drools: INFO
    org.kie: INFO
    io.awspring.cloud: DEBUG

server:
  port: 8080
