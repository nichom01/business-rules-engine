spring.application.name=business-rules-engine
spring.cloud.aws.region.static=${AWS_REGION:us-east-1}
spring.cloud.aws.credentials.use-default-aws-credentials-chain=true

sqs.queue-name=${SQS_QUEUE_NAME:business-rules-queue}

logging.level.com.businessrules=INFO
logging.level.org.drools=WARN
logging.level.org.kie=WARN

server.port=8080
